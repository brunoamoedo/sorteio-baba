# Configuração do nginx para servir o SPA de produção.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão dos textos — o bundle do MUI é o maior ganho aqui.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Assets com hash no nome são imutáveis: um ano de cache e nada de
    # revalidação.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O service worker **não** pode ser cacheado: ele é o mecanismo que
    # distribui as atualizações. Um sw.js velho no cache congela a aplicação
    # na versão anterior.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        expires 1d;
        types { } default_type application/manifest+json;
    }

    # Rotas do React Router: `/partidas/25` precisa devolver o index, não 404.
    location / {
        try_files $uri $uri/ /index.html;
        # O HTML sempre revalida — é ele que aponta para os assets novos.
        add_header Cache-Control "no-cache";
    }
}
