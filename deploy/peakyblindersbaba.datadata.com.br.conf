# VirtualHost do Sorteio da Pelada — peakyblindersbaba.datadata.com.br
#
# Instalação:
#   sudo cp deploy/peakyblindersbaba.datadata.com.br.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite peakyblindersbaba.datadata.com.br
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# O certificado é emitido depois, pelo certbot, que reescreve este arquivo
# acrescentando o bloco :443 e o redirecionamento:
#   sudo certbot --apache -d peakyblindersbaba.datadata.com.br

<VirtualHost *:80>
    ServerName peakyblindersbaba.datadata.com.br

    ErrorLog  ${APACHE_LOG_DIR}/peakyblindersbaba-error.log
    CustomLog ${APACHE_LOG_DIR}/peakyblindersbaba-access.log combined

    # ------------------------------------------------------------------
    # Cabeçalhos de proxy
    # ------------------------------------------------------------------
    # O gunicorn recebe HTTP puro. Sem este cabeçalho o Django não sabe que a
    # requisição original era https, e o `SECURE_SSL_REDIRECT` do `prod.py`
    # devolve 301 para https **em toda** requisição — inclusive nas que já
    # vieram por https. É um loop de redirecionamento que derruba o site
    # inteiro, e o par dele é o `SECURE_PROXY_SSL_HEADER` nas settings.
    #
    # Fica fora do bloco :443 de propósito: o certbot copia este VirtualHost ao
    # criar o de TLS, então a linha vai junto.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPreserveHost On

    # ------------------------------------------------------------------
    # Fotos dos jogadores
    # ------------------------------------------------------------------
    # Servidas em disco, não pelo Django: com `DEBUG=False` ele não serve mídia
    # (ver `config/urls.py`), e mesmo que servisse seria desperdiçar um worker
    # do gunicorn para entregar um JPEG.
    #
    # ⚠️ Ajuste o caminho para onde o repositório está no servidor.
    Alias /media/ /opt/sorteio-baba/data/media/
    <Directory /opt/sorteio-baba/data/media/>
        Require all granted
        Options -Indexes
        # Nome de arquivo com hash é imutável; um ano de cache é seguro.
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=2592000"
        </IfModule>
    </Directory>
    ProxyPass /media/ !

    # ------------------------------------------------------------------
    # Backend
    # ------------------------------------------------------------------
    # `/static/` é do **Django** (admin e DRF, servidos pelo whitenoise). Os
    # estáticos do SPA ficam em `/assets/`, então não há colisão.
    ProxyPass        /api/    http://127.0.0.1:8000/api/
    ProxyPassReverse /api/    http://127.0.0.1:8000/api/
    ProxyPass        /admin/  http://127.0.0.1:8000/admin/
    ProxyPassReverse /admin/  http://127.0.0.1:8000/admin/
    ProxyPass        /static/ http://127.0.0.1:8000/static/
    ProxyPassReverse /static/ http://127.0.0.1:8000/static/

    # ------------------------------------------------------------------
    # Frontend
    # ------------------------------------------------------------------
    # Por último: esta regra casa tudo que sobrou. O nginx do container já
    # resolve as rotas do React Router (`/partidas/25` devolve o index) e os
    # cabeçalhos de cache, inclusive o `no-store` do service worker.
    ProxyPass        /  http://127.0.0.1:8080/
    ProxyPassReverse /  http://127.0.0.1:8080/
</VirtualHost>
