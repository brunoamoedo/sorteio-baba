name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pelada_test
          POSTGRES_USER: pelada
          POSTGRES_PASSWORD: pelada
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q --create-db
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          # O serviço postgres acima já existia, mas a suíte rodava em SQLite e
          # o ignorava — o CI passava verde sem nunca exercitar o banco real.
          # Agora os testes usam o mesmo PostgreSQL de todos os ambientes.
          TEST_DATABASE_URL: postgres://pelada:pelada@localhost:5432/pelada_test
          DATABASE_URL: postgres://pelada:pelada@localhost:5432/pelada_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Type check & build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: pelada-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          # O estágio de produção é o que realmente valida `npm run build`
          # dentro da imagem — o estágio `dev` só instala dependências.
          target: production
          push: false
          tags: pelada-frontend:ci
